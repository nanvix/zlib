name: Nanvix CI

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: ["nanvix/**"]
  pull_request:
    branches: ["nanvix/**"]
  workflow_dispatch:
  repository_dispatch:
    types: [nanvix-minor-release, nanvix-major-release]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'repository_dispatch' }}

jobs:
  get-nanvix-info:
    name: Get Nanvix Info
    runs-on: ubuntu-latest
    outputs:
      nanvix_tag: ${{ steps.resolve.outputs.nanvix_tag }}
      nanvix_sha: ${{ steps.resolve.outputs.nanvix_sha }}
      nanvix_version: ${{ steps.resolve.outputs.nanvix_version }}
      package_name: ${{ steps.resolve.outputs.package_name }}
      package_version: ${{ steps.resolve.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install nanvix-zutil
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          WHEEL_URL=$(gh api repos/nanvix/zutils/releases/latest \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          pip install "$WHEEL_URL"

      - name: Resolve lockfile and extract release info
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          python3 -c "
          import os
          from pathlib import Path
          from nanvix_zutil.manifest import load_manifest
          from nanvix_zutil.resolver import resolve

          manifest = load_manifest(Path('.nanvix/nanvix.toml'))
          lockfile = resolve(manifest, gh_token=os.environ.get('GH_TOKEN'), shallow=True)

          sysroot = next(
              (p for p in lockfile.packages if p.kind == 'sysroot'),
              None,
          )
          if sysroot is None:
              raise SystemExit('No sysroot package in lockfile — check .nanvix/nanvix.toml nanvix-version')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:
              f.write(
                  f'nanvix_tag={sysroot.resolved_tag}\n'
                  f'nanvix_sha={sysroot.resolved_commitish[:7]}\n'
                  f'nanvix_version={sysroot.resolved_tag.lstrip(\"v\")}\n'
                  f'package_name={manifest.name}\n'
                  f'package_version={manifest.version}\n'
              )
          "

      - name: Download Nanvix sysroot assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          gh release download "${{ steps.resolve.outputs.nanvix_tag }}" \
            --repo nanvix/nanvix \
            --pattern "*.tar.bz2" \
            --dir nanvix-artifacts

      - name: Upload Nanvix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanvix-release-artifacts
          path: nanvix-artifacts/*.tar.bz2
          retention-days: 1

  build:
    needs: get-nanvix-info
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [hyperlight, microvm]
        process-mode: [multi-process, single-process, standalone]
        memory: [128mb]
    name: ${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }}
    container:
      image: nanvix/toolchain:latest-minimal
      options: --device /dev/kvm
    defaults:
      run:
        shell: bash
    env:
      NANVIX_MACHINE: ${{ matrix.platform }}
      NANVIX_DEPLOYMENT_MODE: ${{ matrix.process-mode }}
      NANVIX_MEMORY_SIZE: ${{ matrix.memory }}
      USER: runner
    steps:
      - uses: actions/checkout@v4

      - name: Download Nanvix artifacts
        uses: actions/download-artifact@v4
        with:
          name: nanvix-release-artifacts
          path: nanvix-artifacts

      - name: Extract matching sysroot
        run: |
          set -euo pipefail
          PATTERN="${{ matrix.platform }}.*${{ matrix.process-mode }}.*${{ matrix.memory }}.*\.tar\.bz2"
          ARTIFACT=$(find nanvix-artifacts -maxdepth 1 -type f -name "*.tar.bz2" \
            | grep -E "$PATTERN" | head -1)
          if [[ -z "$ARTIFACT" ]]; then
            echo "::error::No sysroot artifact for ${{ matrix.platform }}/${{ matrix.process-mode }}/${{ matrix.memory }}"
            exit 1
          fi
          # Pre-place sysroot where the base class auto-detects it.
          mkdir -p .nanvix/sysroot
          tar -xjf "$ARTIFACT" -C .nanvix/sysroot

      - name: Setup
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: ./z setup

      - name: Build
        run: ./z build

      - name: Test
        if: matrix.process-mode != 'standalone'
        run: ./z test

      - name: Test (standalone — smoke + integration only)
        if: matrix.process-mode == 'standalone'
        run: ./z test -- smoke integration

      - name: Release
        if: success()
        run: ./z release

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zlib-${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }}
          path: dist/*.tar.bz2
          retention-days: 7

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p ci-logs
          cp -f /tmp/*.log ci-logs/ 2>/dev/null || true
          find .nanvix -type f -name "*.log" -exec cp -f {} ci-logs/ \; 2>/dev/null || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.platform }}-${{ matrix.process-mode }}
          path: ci-logs/*
          if-no-files-found: warn

  release:
    needs: [get-nanvix-info, build]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        id: download-artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-artifacts
          pattern: zlib-*

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [[ "${{ steps.download-artifacts.outcome }}" == "failure" ]]; then
            echo "::warning::Artifact download failed — possible API or network issue"
          fi
          find release-artifacts -name "*.tar.bz2" -exec cp {} release-assets/ \; 2>/dev/null || true
          ASSET_COUNT=$(find release-assets -name "*.tar.bz2" 2>/dev/null | wc -l)
          echo "Found $ASSET_COUNT release asset(s)"
          if [[ "$ASSET_COUNT" -eq 0 ]]; then
            echo "::error::No release assets found — all matrix builds may have failed"
            exit 1
          fi
          ls -la release-assets/

      - name: Generate lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./z lock --shallow
          cp .nanvix/nanvix.lock release-assets/nanvix.lock

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NANVIX_VERSION: ${{ needs.get-nanvix-info.outputs.nanvix_version }}
          NANVIX_SHA: ${{ needs.get-nanvix-info.outputs.nanvix_sha }}
          ZLIB_VERSION: ${{ needs.get-nanvix-info.outputs.package_version }}
        run: |
          SEMVER_TAG="${ZLIB_VERSION}-nanvix-${NANVIX_VERSION}"
          COMMITISH_TAG="${ZLIB_VERSION}-nanvix-${NANVIX_SHA}"

          # Idempotency: skip if release already exists.
          if gh release view "$SEMVER_TAG" &>/dev/null; then
            echo "Release $SEMVER_TAG already exists; skipping."
            exit 0
          fi

          gh release create "$SEMVER_TAG" \
            --title "zlib ${ZLIB_VERSION} for Nanvix ${NANVIX_VERSION}" \
            --notes "Automated build from branch ${{ github.ref_name }} at commit ${{ github.sha }}.

          **Build Information:**
          - Workflow Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - Commit: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          - Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          **Nanvix Release:**
          - Version: ${NANVIX_VERSION}
          - Commit: [${NANVIX_SHA}](https://github.com/nanvix/nanvix/commit/${NANVIX_SHA})

          **Package Layout:**
          \`\`\`
          sysroot/
            lib/libz.a
            include/{zlib.h,zconf.h}
            bin/{example.elf,minigzip.elf}
          \`\`\`

          **Dependencies:** None (standalone library)
          **Lockfile:** nanvix.lock included for downstream dependency resolution" \
            --latest \
            release-assets/*.tar.bz2 \
            release-assets/nanvix.lock

          # Create secondary commitish tag.
          git tag -f "$COMMITISH_TAG"
          git push -f origin "refs/tags/$COMMITISH_TAG"

      - name: Trigger dependent workflows
        if: success()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          NANVIX_VERSION: ${{ needs.get-nanvix-info.outputs.nanvix_version }}
          NANVIX_SHA: ${{ needs.get-nanvix-info.outputs.nanvix_sha }}
          ZLIB_VERSION: ${{ needs.get-nanvix-info.outputs.package_version }}
        run: |
          SEMVER_TAG="${ZLIB_VERSION}-nanvix-${NANVIX_VERSION}"
          echo "Triggering sqlite workflow..."
          gh api repos/nanvix/sqlite/dispatches \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -f event_type="zlib-release" \
            -f "client_payload[nanvix_sha]=${NANVIX_SHA}" \
            -f "client_payload[nanvix_version]=${NANVIX_VERSION}" \
            -f "client_payload[zlib_tag]=${SEMVER_TAG}" || echo "::warning::Failed to trigger sqlite workflow"

  report-failure:
    needs: [build, release]
    if: >-
      ${{ always() &&
          (github.event_name == 'push' ||
           github.event_name == 'schedule' ||
           github.event_name == 'repository_dispatch') &&
          (needs.build.result == 'failure' ||
           needs.release.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report failure issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `CI failure`;
            const body = [
              `CI workflow failed.`,
              `- Trigger: ${context.eventName}`,
              `- Run: [#${context.runNumber}](${runUrl})`,
              `- SHA: ${context.sha}`,
              '',
              'Please investigate and take corrective action.'
            ].join('\n');

            const { data: search } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "CI failure"`
            });
            const existing = search.items.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body
              });
              const currentAssignees = existing.assignees.map(a => a.login);
              const desired = ['ppenna', 'danbugs'];
              const missing = desired.filter(a => !currentAssignees.includes(a));
              if (missing.length > 0) {
                await github.rest.issues.addAssignees({
                  owner, repo, issue_number: existing.number, assignees: missing
                });
              }
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, assignees: ['ppenna', 'danbugs']
              });
            }
