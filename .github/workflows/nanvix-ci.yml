name: Nanvix CI

on:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches: ["nanvix/**"]
  pull_request:
    branches: ["nanvix/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref || 'default' }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v1.12.0
    with:
      zutil-version: "v0.7.26"
      platforms: '["hyperlight","microvm"]'
      process-modes: '["multi-process","single-process","standalone"]'
      memory-sizes: '["128mb","256mb"]'
      skip-full-test-modes: '[]'
      caller-event-name: ${{ github.event_name }}
      windows-test: true
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  ci-scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v1.12.0
    with:
      zutil-version: "v0.7.26"
      platforms: '["hyperlight","microvm"]'
      process-modes: '["multi-process","single-process","standalone"]'
      memory-sizes: '["128mb","256mb"]'
      skip-full-test-modes: '[]'
      caller-event-name: 'schedule'
      windows-test: true
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  # Windows integration tests for multi-process and single-process modes.
  # These modes require linuxd (a Linux-only daemon) for functional testing,
  # so they cannot run full tests on Windows.  Instead, we download the
  # pre-built release artifacts produced by the Linux build jobs and verify
  # that the cross-compiled ELF binaries are present and non-trivially sized.
  # This confirms that compilation and linking against the Nanvix sysroot
  # succeeded for every (platform × process-mode × memory) combination.
  # Standalone Windows functional tests are already covered by the reusable
  # workflow's windows-test job.
  windows-integration:
    needs: [ci, ci-scheduled]
    if: >-
      always() &&
      (needs.ci.result == 'success' || needs.ci-scheduled.result == 'success')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [hyperlight, microvm]
        process-mode: [multi-process, single-process]
        memory: [128mb, 256mb]
    name: windows-integration (${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }})
    steps:
      - name: Resolve package info
        id: info
        shell: bash
        run: |
          if [ "${{ needs.ci.result }}" = "success" ]; then
            echo "package_name=${{ needs.ci.outputs.package_name }}" >> "$GITHUB_OUTPUT"
            echo "package_version=${{ needs.ci.outputs.package_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "package_name=${{ needs.ci-scheduled.outputs.package_name }}" >> "$GITHUB_OUTPUT"
            echo "package_version=${{ needs.ci-scheduled.outputs.package_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.info.outputs.package_name }}-${{ steps.info.outputs.package_version }}-x86-${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }}
          path: dist-artifacts

      - name: Verify build artifacts (smoke + integration)
        shell: pwsh
        run: |
          $tarball = Get-ChildItem -Path "dist-artifacts" -Filter "*.tar.bz2" | Select-Object -First 1
          if (-not $tarball) { Write-Error "FAIL: no release tarball found in dist-artifacts/"; exit 1 }

          New-Item -ItemType Directory -Path "dist-verify" -Force | Out-Null
          tar -xjf $tarball.FullName -C dist-verify

          # Smoke: library and headers must exist and be non-trivially sized.
          foreach ($rel in @("sysroot\lib\libz.a", "sysroot\include\zlib.h", "sysroot\include\zconf.h")) {
            $f = Join-Path "dist-verify" $rel
            if (-not (Test-Path $f)) { Write-Error "FAIL: $rel not found"; exit 1 }
            if ((Get-Item $f).Length -lt 100) { Write-Error "FAIL: $rel is suspiciously small"; exit 1 }
            Write-Host "  OK: $rel ($((Get-Item $f).Length) bytes)"
          }

          # Integration: test executables must exist and be non-trivially sized.
          foreach ($rel in @("sysroot\bin\example.elf", "sysroot\bin\minigzip.elf")) {
            $f = Join-Path "dist-verify" $rel
            if (-not (Test-Path $f)) { Write-Error "FAIL: $rel not found"; exit 1 }
            if ((Get-Item $f).Length -lt 1000) { Write-Error "FAIL: $rel is suspiciously small"; exit 1 }
            Write-Host "  OK: $rel ($((Get-Item $f).Length) bytes)"
          }

          Write-Host "PASS: windows-integration ${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }}"
